{% extends "base.html" %}
{% block title %}Recipes · {{ app_name }}{% endblock %}

{% block content %}
<div class="page-head">
  <h1>Recipes</h1>
  <a class="btn btn-primary" href="/recipes/new">+ New recipe</a>
</div>

{% include "recipes/_import_url.html" %}

<form class="filters"
      hx-get="/"
      hx-target="#recipe-results"
      hx-trigger="submit, change, keyup changed delay:300ms from:input[name='q']"
      hx-push-url="true"
      action="/" method="get">
  <div class="filter-row">
    <input type="search" name="q" value="{{ q }}" placeholder="Search name, ingredients, instructions…">
    <select name="sort" aria-label="Sort">
      <option value="name" {% if sort == 'name' %}selected{% endif %}>Name (A–Z)</option>
      <option value="newest" {% if sort == 'newest' %}selected{% endif %}>Newest first</option>
      <option value="oldest" {% if sort == 'oldest' %}selected{% endif %}>Oldest first</option>
    </select>
    <noscript><button class="btn" type="submit">Search</button></noscript>
  </div>

  {% if all_tags %}
  <div class="tag-filter">
    {% for t in all_tags %}
    <label class="chip {% if t.name in selected_tags %}chip--active{% endif %}">
      <input type="checkbox" name="tag" value="{{ t.name }}" {% if t.name in selected_tags %}checked{% endif %}>
      {{ t.name }}
    </label>
    {% endfor %}
  </div>
  {% endif %}
</form>

<div id="recipe-results">
  {% include "recipes/_results.html" %}
</div>
{% endblock %}
