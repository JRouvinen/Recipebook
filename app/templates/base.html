<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ app_name }}{% endblock %}</title>
  <link rel="stylesheet" href="{{ request.url_for('static', path='css/app.css') }}">
  <script src="{{ request.url_for('static', path='js/htmx.min.js') }}" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">🍲 {{ app_name }}</a>
    <nav>
      <a href="/">Recipes</a>
      <a href="/calendar">Calendar</a>
      <a href="/tags">Tags</a>
      <a href="/data">Data</a>
    </nav>
  </header>

  <main class="container">
    {% for message in flashes %}
      <div class="flash {{ message.category }}">{{ message.message }}</div>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">{{ app_name }} v{{ app_version }} · self-hosted</footer>
</body>
</html>
